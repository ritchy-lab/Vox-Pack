# ============================================================
# Vox-Pack — publier une version
# ------------------------------------------------------------
# Deux façons de s'en servir :
#
#   * onglet Actions -> « Publier une version » -> Run workflow :
#     GitHub fabrique les deux fichiers SANS rien publier. Ils restent dans
#     les artefacts, pour vérifier que la fabrication fonctionne.
#
#   * en poussant une étiquette de version (par exemple v1.0) :
#     GitHub fabrique les deux fichiers ET crée la page « Releases » du
#     dépôt, avec les fichiers à télécharger.
#
# Le zip du Mac est fabriqué exactement comme par ./build.sh : mêmes
# attributs nettoyés, même signature, même vérification à l'extraction.
# ============================================================
name: Publier une version

on:
  push:
    tags:
      # GitHub met une majuscule toute seule dans son champ d'étiquette :
      # on accepte donc les deux, sinon la publication reste sans fichier.
      - 'v*'
      - 'V*'
      # Et sans lettre du tout. Le 22 octobre, l'étiquette « 1.4.2 » (V
      # oublié) n'a réveillé aucun robot : la page est restée sans fichiers,
      # et il a fallu la supprimer et la recréer. Une majuscule manquante ne
      # doit pas pouvoir bloquer une publication.
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      etiquette:
        description: "Étiquette de la version à compléter (exemple : V1.0).
          Laisser vide pour fabriquer sans rien publier."
        required: false
        default: ""
      texte:
        description: "Réécrire le texte de la page même s'il est déjà rempli
          (après une correction des notes, par exemple)."
        required: false
        type: boolean
        default: false

jobs:
  # ------------------------------------------------------------
  # macOS
  # ------------------------------------------------------------
  macos:
    name: Fabriquer le .app du Mac
    runs-on: macos-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer les bibliothèques
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compiler l'application
        run: python -m PyInstaller Vox-Pack.spec --noconfirm

      - name: Nettoyer les attributs et signer
        run: |
          xattr -cr "dist/Vox-Pack.app"
          codesign --force --deep --sign - "dist/Vox-Pack.app"
          codesign --verify --deep --strict "dist/Vox-Pack.app"

      - name: Fabriquer le zip
        run: |
          ditto -c -k --norsrc --noextattr --noacl --keepParent \
            "dist/Vox-Pack.app" "dist/Vox-Pack.zip"

      - name: Vérifier le zip, comme le fera l'utilisateur
        run: |
          mkdir -p /tmp/verif
          ditto -x -k "dist/Vox-Pack.zip" /tmp/verif
          codesign --verify --deep --strict "/tmp/verif/Vox-Pack.app"
          if [ ! -d "/tmp/verif/Vox-Pack.app" ]; then
            echo "Le zip ne contient pas l'application."
            exit 1
          fi

      - name: Déposer le zip
        uses: actions/upload-artifact@v7
        with:
          name: Vox-Pack-macOS
          path: dist/Vox-Pack.zip
          if-no-files-found: error

  # ------------------------------------------------------------
  # Windows
  # ------------------------------------------------------------
  windows:
    name: Fabriquer le .exe du PC
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer les bibliothèques
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Une publication ne doit pas partir avec un défaut que seule la machine
      # d'un utilisateur révélerait (les trois cas d'octobre 2026).
      - name: Vérifier le code avant de fabriquer
        run: python tests/fumee_windows.py

      - name: Compiler l'application
        run: python -m PyInstaller Vox-Pack.spec --noconfirm

      - name: Vérifier que le .exe existe
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Vox-Pack.exe")) {
            Write-Error "Le .exe n'a pas été fabriqué."
            exit 1
          }
          Get-Item "dist/Vox-Pack.exe" | Format-List Name, Length

      - name: Déposer le .exe
        uses: actions/upload-artifact@v7
        with:
          name: Vox-Pack-Windows
          path: dist/Vox-Pack.exe
          if-no-files-found: error

  # ------------------------------------------------------------
  # La page « Releases », seulement quand on pousse une étiquette
  # ------------------------------------------------------------
  publier:
    name: Créer la page de téléchargement
    needs: [macos, windows]
    # Soit on a poussé une étiquette, soit on a lancé la fabrication à la main
    # en indiquant l'étiquette d'une version déjà publiée.
    if: startsWith(github.ref, 'refs/tags/') || inputs.etiquette != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Récupérer les deux fichiers fabriqués
        uses: actions/download-artifact@v7
        with:
          path: fichiers

      # Deux cas possibles, et il faut les deux :
      #   * la page n'existe pas encore (on a poussé une étiquette à la main) :
      #     on la crée, avec le texte de docs/notes-de-version.md ;
      #   * la page existe déjà (Richard l'a créée depuis l'interface GitHub,
      #     ce qui est le chemin le plus simple) : on y dépose les deux
      #     fichiers, et si cette page est arrivée SANS texte — c'est le cas de
      #     la 1.4.1, titre vide et corps vide — on y met les notes. On ne
      #     remplit que la version qu'on vient de fabriquer, et seulement si le
      #     texte est vide : jamais par-dessus un texte écrit à la main.
      - name: Déposer les fichiers dans la version
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETTE: ${{ inputs.etiquette || github.ref_name }}
          # « texte » n'existe que pour un lancement à la main : par défaut on
          # ne touche pas au texte d'une page déjà remplie.
          TEXTE: ${{ inputs.texte || 'false' }}
        run: |
          echo "Version visée : ${ETIQUETTE}"
          # Le fichier de notes est l'historique complet, dans les deux langues.
          # La page, elle, ne montre que la version du jour puis l'installation :
          # sinon un visiteur de la 1.4.2 y lisait les nouveautés de la 1.3.
          python3 docs/page-de-version.py "${ETIQUETTE}" > page.md
          if gh release view "${ETIQUETTE}" >/dev/null 2>&1; then
            echo "La page existe déjà : on y ajoute les fichiers."
            gh release upload "${ETIQUETTE}" \
              "fichiers/Vox-Pack-macOS/Vox-Pack.zip" \
              "fichiers/Vox-Pack-Windows/Vox-Pack.exe" --clobber
            corps="$(gh release view "${ETIQUETTE}" --json body -q .body)"
            locale="$(python3 -c 'import version; print(version.VERSION)' 2>/dev/null || echo "")"
            # Comparaison sans la lettre de tête : « V1.4.2 », « v1.4.2 » et
            # « 1.4.2 » désignent la même version. Avec tr et sed, et non
            # ${VAR,,} : cette écriture n'existe qu'à partir de bash 4, et le
            # Mac de Richard en est resté à bash 3.2.
            visee="$(printf '%s' "${ETIQUETTE}" | tr 'A-Z' 'a-z' | sed 's/^v//')"
            courante="$(printf '%s' "${locale}" | tr 'A-Z' 'a-z' | sed 's/^v//')"
            if [ -n "${locale}" ] && [ "${visee}" = "${courante}" ] \
               && { [ -z "${corps}" ] || [ "${TEXTE}" = "true" ]; }; then
              echo "Texte de la page : on y met les notes de cette version."
              gh release edit "${ETIQUETTE}" \
                --notes-file page.md
            fi
          else
            echo "La page n'existe pas : on la crée."
            gh release create "${ETIQUETTE}" \
              --title "Vox-Pack ${ETIQUETTE}" \
              --notes-file page.md \
              "fichiers/Vox-Pack-macOS/Vox-Pack.zip" \
              "fichiers/Vox-Pack-Windows/Vox-Pack.exe"
          fi
