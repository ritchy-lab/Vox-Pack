# ============================================================
# Vox-Pack — fabrication de la version Windows
# ------------------------------------------------------------
# À chaque envoi sur la branche main, GitHub compile l'application et dépose
# le .exe dans les « artefacts » de la page Actions. Il n'y a donc rien à
# installer sur un PC : on télécharge le fichier déjà fabriqué.
#
# Les actions sont en v7 : les versions v4 et v5 tournent encore sur
# Node.js 20, que GitHub abandonne (avertissement « Node.js 20 is
# deprecated » à chaque compilation).
#
# Pour récupérer le .exe :
#   1. onglet « Actions » du dépôt
#   2. dernière exécution « Fabriquer la version Windows »
#   3. tout en bas, section « Artifacts » -> Vox-Pack-Windows.zip
# ============================================================
name: Fabriquer la version Windows

on:
  push:
    branches: [main]
  workflow_dispatch:        # permet aussi de la lancer à la main

jobs:
  windows:
    name: Compiler le .exe
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installer les bibliothèques
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Les trois défauts d'octobre 2026 ne se voyaient que sur PC : écriture
      # d'un WAV en « .tmp », réécriture de la liste, traitement du niveau.
      # Mieux vaut les attraper ici que chez un utilisateur. Les cinq tests de
      # la v2 tournent aussi : ils isolent HOME/USERPROFILE eux-mêmes.
      - name: Vérifier le code avant de fabriquer
        run: |
          python tests/fumee_windows.py
          python tests/v2_textes.py
          python tests/v2_langues.py
          python tests/v2_paquet.py
          python tests/v2_ecran.py
          python tests/v2_adaptation.py

      # Onedir : l'application démarre sans décompresser 50 Mo. C'est ce
      # dossier que l'installeur emballe.
      - name: Compiler l'application
        run: python -m PyInstaller Vox-Pack.spec --noconfirm

      - name: Vérifier que l'application démarre
        shell: pwsh
        run: |
          $exe = "dist\Vox-Pack\Vox-Pack.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Le dossier Vox-Pack n'a pas été fabriqué."
            exit 1
          }
          $processus = Start-Process -FilePath $exe `
            -ArgumentList "--smoke-test" -PassThru -Wait
          if ($processus.ExitCode -ne 0) {
            Write-Error "Vox-Pack.exe ne démarre pas (code $($processus.ExitCode))."
            exit 1
          }

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Fabriquer l'installeur
        shell: pwsh
        run: |
          $version = (python -c "import version; print(version.VERSION)").Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" "installer\Vox-Pack.iss"
          if (-not (Test-Path "dist\Vox-Pack-Setup.exe")) {
            Write-Error "L'installeur n'a pas été fabriqué."
            exit 1
          }
          Get-Item "dist\Vox-Pack-Setup.exe" | Format-List Name, Length

      # On installe pour de vrai, on démarre l'application installée, puis on
      # désinstalle : un installeur qui compile mais qui n'installe rien ne
      # doit pas partir chez quelqu'un.
      - name: Vérifier l'installeur (installation silencieuse)
        shell: pwsh
        run: |
          $cible = Join-Path $env:RUNNER_TEMP "VoxPackTest"
          if (Test-Path $cible) { Remove-Item $cible -Recurse -Force }
          $installation = Start-Process -FilePath "dist\Vox-Pack-Setup.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$cible" `
            -PassThru -Wait
          if ($installation.ExitCode -ne 0) {
            Write-Error "L'installation a échoué (code $($installation.ExitCode))."
            exit 1
          }
          $exe = Join-Path $cible "Vox-Pack.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "L'application n'est pas dans le dossier d'installation."
            exit 1
          }
          $processus = Start-Process -FilePath $exe `
            -ArgumentList "--smoke-test" -PassThru -Wait
          if ($processus.ExitCode -ne 0) {
            Write-Error "L'application installée ne démarre pas (code $($processus.ExitCode))."
            exit 1
          }
          $desinstallation = Join-Path $cible "unins000.exe"
          if (Test-Path $desinstallation) {
            Start-Process -FilePath $desinstallation `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          }

      # La version portable de secours : l'ancien fichier unique, avec le
      # splash. Elle ne remplace pas l'installeur, elle le double.
      - name: Compiler la version portable (fichier unique)
        env:
          VOXPACK_ONEFILE: '1'
        run: python -m PyInstaller Vox-Pack.spec --noconfirm --distpath dist/portable --workpath build/portable

      - name: Vérifier la version portable
        shell: pwsh
        run: |
          $exe = "dist\portable\Vox-Pack.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "La version portable n'a pas été fabriquée."
            exit 1
          }
          $processus = Start-Process -FilePath $exe `
            -ArgumentList "--smoke-test" -PassThru -Wait
          if ($processus.ExitCode -ne 0) {
            Write-Error "La version portable ne démarre pas (code $($processus.ExitCode))."
            exit 1
          }

      - name: Déposer l'installeur
        uses: actions/upload-artifact@v7
        with:
          name: Vox-Pack-Windows
          path: dist/Vox-Pack-Setup.exe
          if-no-files-found: error

      - name: Déposer la version portable
        uses: actions/upload-artifact@v7
        with:
          name: Vox-Pack-Portable
          path: dist/portable/Vox-Pack.exe
          if-no-files-found: error
